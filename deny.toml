# cargo-deny configuration. It enforces the dependency policy of
# docs/adr/0006-dependency-policy.md; docs/dependencies.md says why each dependency is used.
# Run with `cargo deny --locked check` (scripts/check.sh does).

[graph]
# Check the dependencies of every feature of the workspace crates, not only of the default ones.
# (This does not reach the optional dependencies of third-party crates that nothing enables.)
all-features = true
# Only the crates compiled for the supported targets (ADR-0015): Cargo.lock also holds the crates of
# platforms the engine does not build for (Android, macOS, the web), whose advisories and duplicate
# versions would otherwise be reported (ADR-0023).
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
# Every RustSec advisory (vulnerability, unsound or unmaintained crate) affecting a dependency
# fails the check. An advisory may be ignored only with an entry here that says why.
ignore = [
    # zvariant, zbus_names and zvariant_derive are unmaintained as crates of their own: zbus 6
    # holds them. AccessKit's adapter on Linux, accesskit_unix 0.24.1, the latest, speaks D-Bus
    # through zbus 5, which uses them; they are built only with the `accessibility` feature of
    # slime-platform and slime-app, which the examples turn on and games leave out (ADR-0146).
    # Not vulnerabilities. Remove these once AccessKit's adapter moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6; only AccessKit's adapter on Linux uses it, through zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6; only AccessKit's adapter on Linux uses it, through zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6; only AccessKit's adapter on Linux uses it, through zbus 5" },
]

[licenses]
# Licenses compatible with distributing SlimeEngine under MPL-2.0 and games under any license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# The default fonts of egui, drawn by the dev overlay: tooling, which ships with its fonts in the
# programs that draw it, Hunna Wood among them, their licenses beside them (ADR-0031, ADR-0105).
# OFL-1.1 is OSI-approved; the Ubuntu Font Licence is not, hence an exception for this one crate
# rather than an allowed license.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
# Workspace crates are not published; their license is set once in the workspace Cargo.toml.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version; that is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
