# Workspace layout and naming: docs/adr/0004-workspace-layout-and-crate-naming.md
# Lints and unsafe policy: docs/adr/0005-lints-and-unsafe-policy.md
[workspace]
members = ["benches", "crates/*", "examples", "games/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
# Equal to the toolchain pinned in rust-toolchain.toml (ADR-0003).
rust-version = "1.99"
license = "MPL-2.0"
publish = false

# Third-party dependencies, one version for the whole workspace. Each one is listed with its
# reason in docs/dependencies.md (ADR-0006).
[workspace.dependencies]
# The asset pipeline's cooker only: computes the tangents of a mesh that has none with MikkTSpace,
# as glTF asks and as normal textures are baked against (ADR-0069).
bevy_mikktspace = "1.0.0"
# The asset pipeline's cooker only: hashes what made a cooked file and derives the IDs of the assets
# inside a source file (ADR-0069). Built without its SIMD code in C and assembly (`pure`), so that
# no C compiler is needed.
blake3 = { version = "1.8.7", features = ["pure"] }
# Compresses textures in BC7 and BC5 on the CPU, a port of Intel's encoders to Rust (ADR-0069): the
# asset pipeline's cooker, and the tests of slime-gfx. Without its default features, which would add BC6H and encoding on the GPU
# through wgpu.
block_compression = { version = "0.10.1", default-features = false, features = ["bc15", "bc7"] }
# `termination` also handles SIGTERM and SIGHUP, not only SIGINT.
ctrlc = { version = "3.5.2", features = ["termination"] }
# Vectors, matrices and quaternions for the renderer; its types are part of slime-render's API
# (ADR-0027).
glam = "0.34.1"
# Writes the KTX2 files that hold cooked textures (ADR-0069); slime-assets reads them with a reader
# of its own, which checks a file before it copies its levels (ADR-0102).
ktx2 = "0.5.0"
# Reads glTF files: the asset pipeline's importer (ADR-0069), and the examples' tests, which write
# glTF files to cook. Without the `import` feature, which would bring the `image` and `base64`
# crates: the importer reads buffers and images itself, and decodes images with `png` and
# `zune-jpeg`. With `KHR_lights_punctual` and `KHR_materials_emissive_strength`, which add no crate
# (ADR-0037), and `extras`, the custom values of nodes, which a game reads.
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils", "extras", "KHR_lights_punctual", "KHR_materials_emissive_strength"] }
# The dev overlay of Stage 3a, tooling only (ADR-0031): egui-wgpu without its default features,
# which would enable every wgpu backend, and no egui-winit, since the engine translates its own
# events. Upgrading wgpu waits for an egui release built against it.
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
# Windows only: asks the console to interpret the escape sequences that color the log. Already
# built as a dependency of tracing-subscriber.
nu-ansi-term = "0.50.3"
# Reads PNG files: the source images of the asset pipeline's cooker; the examples and tests write
# and read them too (reference images, the offscreen example).
png = "0.18.1"
# The engine's MCP server only (ADR-0099, ADR-0122): the Model Context Protocol, through its
# official SDK, served on standard input and output, its tools' parameters described by the
# JSON Schema of `schemars`, which rmcp re-exports; tokio, the runtime it runs on; serde, which reads
# the tools' parameters; base64, which encodes the images it returns.
base64 = "0.23"
rmcp = { version = "3.6.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt"] }
# The MCP server's tests only: they speak JSON-RPC to it. Already built for gltf and rmcp.
serde_json = "1.0.154"
# The development channel's secret token: 128 bits from the system's randomness, which the
# standard library does not give yet (ADR-0122). Already built for uuid.
getrandom = "0.4.3"
# Waits for wgpu's requests, which are futures: opening the GPU, and the errors caught while a
# shader module or pipeline is created.
pollster = "1.0.1"
# The derive macro of reflection only (ADR-0080), with `quote` and `syn`: tokens, their quoting, and
# the parsing of the type a derive is given. Already built by the workspace, for thiserror's
# derive: they add no crate to the build. `syn`'s default features, without `full`,
# which a derive does not need.
proc-macro2 = "1.0.107"
quote = "1.0.47"
raw-window-handle = "0.6.2"
syn = "3.0.8"
thiserror = "2.0.21"
# Parses TOML documents, sources and saves (ADR-0080): only its parser, `toml_parser`, `winnow` and
# `toml_datetime`, without its writer, since the engine writes its documents itself, and without
# `serde`.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
# The `attributes` feature (`#[instrument]`) is left out: it pulls in a proc-macro stack.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The asset pipeline's cooker only: random IDs for source files (`v4`), and the IDs derived for the
# assets inside them (`v8`), as UUIDs (ADR-0069).
uuid = { version = "1.28.0", features = ["v4", "v8"] }
# Vulkan on Linux, Direct3D 12 on Windows, WGSL shaders (ADR-0016). OpenGL, Metal and WebGPU are
# left out; `vulkan` also builds on Windows, where it is not used by default.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "wgsl"] }
# Default features, except that client-side decorations (drawn by the application when the
# compositor does not draw them, as on GNOME) are built without title text: the text renderer
# depends on `ttf-parser`, which is unmaintained (RUSTSEC-2026-0192).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# The system's clipboard of text, in slime-platform (ADR-0132, ADR-0145): without its images
# (`image-data`, which brings the `image` crate), with the Wayland protocol of the compositors that
# give it (`wayland-data-control`), X11's otherwise.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
# The asset pipeline's cooker only: decodes JPEG images (ADR-0069).
zune-jpeg = "0.5.15"
# The text of the engine's interface, in slime-ui (ADR-0132, ADR-0136): parley shapes, orders, breaks
# and lays out text, through HarfRust, Skrifa and ICU4X, with the dictionaries that break the lines
# of the scripts that put no space between their words (`complex-scripts`); fontique, parley's,
# finds fonts, the system's through fontconfig loaded at run time rather than linked
# (`fontconfig-dlopen`); swash rasterizes glyphs, with the Skrifa that parley uses.
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
parley = { version = "0.12.0", features = ["complex-scripts"] }
swash = "0.2.10"
# slime-ui's text only: the Unicode writing system of each character, by which the system's font
# found for a writing system is named for its characters (ADR-0136). Already built for parley, with
# its data.
icu_properties = "2.4.0"
# The glyphs' atlas of slime-ui-render (ADR-0132, ADR-0139): places each glyph's image in an atlas
# page by shelves, and frees it alone, as the least recently used glyphs leave. Brings euclid, its
# sizes and rectangles, already built for egui.
etagere = "0.3.0"
# The layout of slime-ui's tree of elements (ADR-0132): CSS's flexbox and grid, run through taffy's
# traits on the framework's own arena, without taffy's tree of its own (`taffy_tree`) nor its
# parser of CSS.
taffy = { version = "0.15.0", default-features = false, features = ["std", "flexbox", "grid", "content_size"] }

# Workspace crates.
slime-app = { path = "crates/slime-app" }
slime-channel = { path = "crates/slime-channel" }
slime-assets = { path = "crates/slime-assets" }
slime-color = { path = "crates/slime-color" }
slime-cook = { path = "crates/slime-cook" }
slime-devui = { path = "crates/slime-devui" }
slime-editor = { path = "crates/slime-editor" }
slime-gfx = { path = "crates/slime-gfx" }
slime-input = { path = "crates/slime-input" }
slime-platform = { path = "crates/slime-platform" }
slime-reflect = { path = "crates/slime-reflect" }
slime-reflect-derive = { path = "crates/slime-reflect-derive" }
slime-serialize = { path = "crates/slime-serialize" }
slime-tasks = { path = "crates/slime-tasks" }
slime-ui = { path = "crates/slime-ui" }
slime-ui-render = { path = "crates/slime-ui-render" }
slime-render = { path = "crates/slime-render" }
slime-world = { path = "crates/slime-world" }
slime-world-render = { path = "crates/slime-world-render" }
# The sample game's library, which its editor package links (ADR-0110).
hunnawood = { path = "games/hunnawood" }

# Each crate compiled once, and dependencies with their line tables only
# (docs/adr/0104-the-build-ci-and-measurements.md). The workspace's procedural macro is built with
# the debug information of `dev` when it is built as a member, and of `build-override` when it is
# built for the crates that use it: the two match, or `cargo test` after `cargo build` builds it
# again, with every crate that depends on it.
[profile.dev.build-override]
debug = true

# Dependencies keep the tables that give a backtrace's frames their file and line in them, not the
# rest of their debug information, which made most of `target`.
[profile.dev.package."*"]
debug = "line-tables-only"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "warn"
