[package]
name = "slime-benches"
description = "SlimeEngine's benchmarks, whose figures docs/measurements.md tracks from one milestone to the next."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The engine's log, the trace that SLIME_TRACE asks for, and the bridge through which the engine
# draws uwui, which `render.canvas` and `ui.draw.menu` draw through (ADR-0244).
slime-app.workspace = true
slime-assets.workspace = true
slime-color.workspace = true
# Starts an editor's program and asks it to play, for Play's time to control (ADR-0166).
slime-channel.workspace = true
# Cooks the examples' sample, whose meshes the world's benchmarks place.
slime-cook.workspace = true
slime-gfx.workspace = true
slime-render.workspace = true
# The dev overlay's world panel on the engine's interface (ADR-0152).
slime-devui.workspace = true
# The editor's hierarchy (ADR-0167), and its window without a window of the system (ADR-0186).
slime-editor.workspace = true
# The editor's program on Hunna Wood's zone, whose interface `editor.window.zone` measures
# (ADR-0186).
hunnawood-editor.workspace = true
# The interface's text (ADR-0136), and the editor's look, which the world panel is measured in; a
# person's input, which a pointer's move is measured by (ADR-0253).
uwui = { workspace = true, features = ["editor-look", "test-input"] }
# uwui's reader of KDL, the notation of its documents (ADR-0241).
uwui-kdl.workspace = true
# The canvas that `render.canvas` fills, and the canvas's renderer, whose cost against the renderer's
# `tests/canvas_cost.rs` measures (ADR-0139, ADR-0180).
uwui-render.workspace = true
slime-world.workspace = true
slime-world-render.workspace = true
