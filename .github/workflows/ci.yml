# Runs the automated checks of the definition of done on each push to main and on each pull
# request, on Linux and on Windows (docs/adr/0015-platforms-and-ci.md). Actions are pinned to
# commit SHAs, with the release they correspond to in a comment.
name: CI

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every check, in the same Nix shell that contributors use: a local run of scripts/check.sh and
  # this job are identical (docs/adr/0007-documentation-tooling-and-ci.md).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Without the flag, an incomplete flake.lock would be completed with an unpinned revision.
      - run: nix develop --no-update-lock-file --command scripts/check.sh

  # What can only be checked on Windows: running the build, the tests and the samples there. The
  # checks that do not depend on the platform (formatting, rustdoc, dependencies, links) and
  # compiling for Windows already run in the Linux job.
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The tests run one at a time: WARP's shader compiler crashes the process, now and then, when
      # several threads compile shaders at once, even on separate devices (an access violation in
      # d3d10warp.dll, which no test can catch; seen in other projects too). Without failing fast,
      # every image test runs, and the last step publishes the image of each one that fails.
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1
      # The image tests print the difference they measured against the reference, which only this
      # job can tell for WARP; the step above has run them already.
      - name: Image tests, printing their measurements
        run: cargo test --locked -p slime-examples -- --nocapture --test-threads=1
      - name: GPU timing and multi-pass tests, printing what WARP measures
        run: cargo test --locked -p slime-gfx --test timing --test passes -- --nocapture --test-threads=1
      - name: Headless samples
        run: |
          cargo run --locked --example headless -- --frames 600
          cargo run --locked --example window -- --headless --frames 600
          cargo run --locked --example offscreen -- --output target/triangle.png
      - name: Build the examples for checks by hand
        run: cargo build --locked --release --examples
      - name: Run the headless samples of the release build
        run: |
          target/release/examples/headless.exe --frames 600
          target/release/examples/offscreen.exe --output target/triangle-release.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slime-examples-windows
          path: |
            target/release/examples/hello.exe
            target/release/examples/headless.exe
            target/release/examples/window.exe
            target/release/examples/offscreen.exe
            target/release/examples/scene.exe
          if-no-files-found: error
          retention-days: 14
      # An image test that fails writes the image it rendered in target/tmp (CARGO_TARGET_TMPDIR).
      # Only this job can show what WARP drew, and the runner is discarded with that image.
      - name: Publish the images rendered by the image tests that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-test-failures-windows
          path: target/tmp/*.actual.png
          if-no-files-found: ignore
          retention-days: 14
