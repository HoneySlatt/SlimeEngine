# Runs the automated checks of the definition of done on each push to main and on each pull
# request, on Linux and on Windows (docs/adr/0015-platforms-and-ci.md). Actions are pinned to
# commit SHAs, with the release they correspond to in a comment.
name: CI

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every check, in the same Nix shell that contributors use: a local run of scripts/check.sh does
  # what these three jobs do together (docs/adr/0007-documentation-tooling-and-ci.md). Each runs one
  # part of the script, side by side, each within the owner's limit of 20 minutes
  # (docs/adr/0123-the-linux-checks-in-two-jobs.md, docs/adr/0155-the-editors-design.md):
  # `headless`, every check that needs neither a compositor nor the sample game's zone, `windowed`,
  # the examples and the windowed lifecycle test run in headless Weston compositors, and `game`,
  # everything that reads the zone.
  check:
    strategy:
      fail-fast: false
      matrix:
        part: [headless, windowed, game]
    name: check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The sample game's zone, which scripts/fetch-assets.sh fetches from its mirror for the checks
      # to cook, kept from one run to the next while its list is unchanged; the metadata files come
      # from the checkout (docs/adr/0070-the-sample-games-source-assets.md). Only the `game` part
      # reads it.
      - if: matrix.part == 'game'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            games/hunnawood/assets/zone
            !games/hunnawood/assets/zone/**/*.meta
          key: hunnawood-zone-${{ hashFiles('games/hunnawood/assets/sources.tsv') }}
      # The zone cooked, kept from one run to the next while what makes its bytes is unchanged: its
      # sources and their metadata, the crates of the cooker, the packages it is built from at the
      # versions that Cargo.lock pins, the toolchain and the platform
      # (docs/adr/0104-the-build-ci-and-measurements.md,
      # docs/adr/0144-the-cooked-zones-key-in-ci.md). The cook then reuses every file, which it
      # checks first. A crate of the workspace that the cooker comes to depend on joins the key, here
      # and in the Windows jobs.
      - name: The packages that the cooker is built from
        if: matrix.part == 'game'
        id: cooker
        run: nix develop --no-update-lock-file --command scripts/cooker-dependencies.sh >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'game'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cooked/hunnawood
          key: hunnawood-cooked-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('games/hunnawood/assets/sources.tsv', 'games/hunnawood/assets/zone/**/*.meta', 'games/hunnawood/assets/zone/**/*.scene', 'crates/slime-cook/src/**', 'crates/slime-cook/Cargo.toml', 'crates/slime-assets/src/**', 'crates/slime-assets/Cargo.toml', 'crates/slime-color/src/**', 'crates/slime-color/Cargo.toml', 'crates/slime-reflect/src/**', 'crates/slime-reflect/Cargo.toml', 'crates/slime-reflect-derive/src/**', 'crates/slime-reflect-derive/Cargo.toml', 'crates/slime-serialize/src/**', 'crates/slime-serialize/Cargo.toml', 'crates/slime-world/src/**', 'crates/slime-world/Cargo.toml', 'rust-toolchain.toml') }}-${{ steps.cooker.outputs.hash }}
      # Without the flag, an incomplete flake.lock would be completed with an unpinned revision.
      - run: nix develop --no-update-lock-file --command scripts/check.sh ${{ matrix.part }}

  # What can only be checked on Windows: running the build, the tests and the samples there. The
  # checks that do not depend on the platform (formatting, rustdoc, dependencies, links) and
  # compiling for Windows already run in the Linux jobs. Two jobs run in parallel, past the 20
  # minutes that one took (docs/adr/0081-stage-5a-the-world.md,
  # docs/adr/0104-the-build-ci-and-measurements.md): this one runs the tests and the samples of the
  # debug build; `windows-release` runs clippy and builds the programs that CI publishes.
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # Direct3D 12 compiles shaders with the DXC that lies beside the program, as where the
      # engine's programs are shipped (docs/adr/0066-shipping-dxc-beside-the-programs.md): here,
      # beside the tests and the samples that cargo runs.
      - name: Put DXC beside the tests and the samples
        run: scripts/fetch-dxc.sh target/debug/deps target/debug/examples
      # The tests run one at a time: WARP's shader compiler crashes the process, now and then, when
      # several threads compile shaders at once, even on separate devices (an access violation in
      # d3d10warp.dll, which no test can catch; seen in other projects too). Without failing fast,
      # every image test runs, and the last step publishes the image of each one that fails.
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1
      # The image tests print the difference they measured against the reference, which only this
      # job can tell for WARP; the step above has run them already.
      - name: Image tests, printing their measurements
        run: cargo test --locked -p slime-examples -- --nocapture --test-threads=1
      - name: GPU timing and multi-pass tests, the renderer's shaders made again, and the device's limits, printing what WARP measures and offers
        run: |
          cargo test --locked -p slime-gfx --test timing --test passes -- --nocapture --test-threads=1
          cargo test --locked -p slime-gfx --lib -- the_device_opens_above_the_floor_and_prints_its_limits --nocapture
          cargo test --locked -p slime-render --test shaders -- --nocapture --test-threads=1
      - name: Headless samples
        run: |
          cargo run --locked --example headless -- --frames 600
          cargo run --locked --example window -- --headless --frames 600
          cargo run --locked --example offscreen -- --output target/triangle.png
          # The interface reads its style sheet and themes cooked with the sample.
          cargo run --locked -p slime-cook -- cook examples/assets target/cooked/examples
          cargo run --locked --example interface -- --output target/interface.png
          cargo run --locked --example widgets -- --output target/widgets.png
      # The sample game's zone, fetched from its mirror and kept between runs while its list is
      # unchanged, then cooked for the tests that read it
      # (docs/adr/0070-the-sample-games-source-assets.md).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            games/hunnawood/assets/zone
            !games/hunnawood/assets/zone/**/*.meta
          key: hunnawood-zone-${{ hashFiles('games/hunnawood/assets/sources.tsv') }}
      # The zone cooked, kept as in the Linux jobs.
      - name: The packages that the cooker is built from
        id: cooker
        run: scripts/cooker-dependencies.sh >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cooked/hunnawood
          key: hunnawood-cooked-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('games/hunnawood/assets/sources.tsv', 'games/hunnawood/assets/zone/**/*.meta', 'games/hunnawood/assets/zone/**/*.scene', 'crates/slime-cook/src/**', 'crates/slime-cook/Cargo.toml', 'crates/slime-assets/src/**', 'crates/slime-assets/Cargo.toml', 'crates/slime-color/src/**', 'crates/slime-color/Cargo.toml', 'crates/slime-reflect/src/**', 'crates/slime-reflect/Cargo.toml', 'crates/slime-reflect-derive/src/**', 'crates/slime-reflect-derive/Cargo.toml', 'crates/slime-serialize/src/**', 'crates/slime-serialize/Cargo.toml', 'crates/slime-world/src/**', 'crates/slime-world/Cargo.toml', 'rust-toolchain.toml') }}-${{ steps.cooker.outputs.hash }}
      - name: Fetch and cook the sample game's zone
        run: |
          scripts/fetch-assets.sh zone/
          cargo run --locked --release -p slime-cook -- cook games/hunnawood/assets/zone target/cooked/hunnawood
      - name: The tests that read the sample game's zone
        run: cargo test --locked -p hunnawood -p hunnawood-editor -- --ignored
      # An image test that fails writes the image it rendered in target/tmp (CARGO_TARGET_TMPDIR).
      # Only this job can show what WARP drew, and the runner is discarded with that image.
      - name: Publish the images rendered by the image tests that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-test-failures-windows
          path: target/tmp/*.actual.png
          if-no-files-found: ignore
          retention-days: 14

  # Clippy on Windows, and the programs that CI publishes, built in release and run.
  windows-release:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    # The C runtime is linked statically, so that the published programs start on a Windows
    # without the Visual C++ Redistributable (a fresh install, Windows Sandbox). How shipped games
    # link it is decided with their packaging (Stage 9b). The cooker is built the same way, so that
    # it shares the programs' build.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # Clippy builds nothing that the release build shares; RUSTFLAGS does not change its lints.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the examples and the game for checks by hand
        run: |
          cargo build --locked --release --examples
          cargo build --locked --release -p hunnawood
      # The zone, fetched and cooked as in the `windows` job, for the game that CI ships.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            games/hunnawood/assets/zone
            !games/hunnawood/assets/zone/**/*.meta
          key: hunnawood-zone-${{ hashFiles('games/hunnawood/assets/sources.tsv') }}
      - name: The packages that the cooker is built from
        id: cooker
        run: scripts/cooker-dependencies.sh >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cooked/hunnawood
          key: hunnawood-cooked-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('games/hunnawood/assets/sources.tsv', 'games/hunnawood/assets/zone/**/*.meta', 'games/hunnawood/assets/zone/**/*.scene', 'crates/slime-cook/src/**', 'crates/slime-cook/Cargo.toml', 'crates/slime-assets/src/**', 'crates/slime-assets/Cargo.toml', 'crates/slime-color/src/**', 'crates/slime-color/Cargo.toml', 'crates/slime-reflect/src/**', 'crates/slime-reflect/Cargo.toml', 'crates/slime-reflect-derive/src/**', 'crates/slime-reflect-derive/Cargo.toml', 'crates/slime-serialize/src/**', 'crates/slime-serialize/Cargo.toml', 'crates/slime-world/src/**', 'crates/slime-world/Cargo.toml', 'rust-toolchain.toml') }}-${{ steps.cooker.outputs.hash }}
      - name: Fetch and cook the sample game's zone
        run: |
          scripts/fetch-assets.sh zone/
          cargo run --locked --release -p slime-cook -- cook games/hunnawood/assets/zone target/cooked/hunnawood
      - name: Check that the examples and the game do not import the Visual C++ runtime
        run: |
          if grep -l -a -i 'vcruntime140' target/release/examples/*.exe target/release/hunnawood.exe; then
            echo 'these programs import VCRUNTIME140.dll'
            exit 1
          fi
      - name: Gather the programs for checks by hand, with DXC beside them and their data cooked
        run: |
          mkdir -p target/windows
          cp target/release/examples/{hello,headless,window,offscreen,interface,widgets,scene,world}.exe target/windows/
          # The licenses of the parts of Noto fonts that interface.exe embeds, and of Geist, Geist
          # Mono and Lucide, which widgets.exe embeds, and scene.exe, world.exe and hunnawood.exe in
          # their dev overlay (ADR-0133, ADR-0150, ADR-0152).
          cp crates/slime-ui/tests/fonts/*.OFL.txt crates/slime-ui/look/Geist.OFL.txt crates/slime-ui/look/Lucide.LICENSE.txt target/windows/
          cp target/release/hunnawood.exe target/windows/
          scripts/fetch-dxc.sh target/windows
          cargo run --locked --release -p slime-cook -- cook examples/assets target/windows/assets
          cp -r target/cooked/hunnawood target/windows/hunnawood-assets
          scripts/credits.sh > target/windows/hunnawood-CREDITS.txt
      # The offscreen sample's log says which compiler Direct3D 12 took: DXC, beside it.
      - name: Run the headless samples of the release build
        run: |
          target/windows/headless.exe --frames 600
          target/windows/world.exe --headless --frames 600
          target/windows/interface.exe --output target/interface-release.png
          target/windows/widgets.exe --output target/widgets-release.png
          SLIME_LOG=info target/windows/offscreen.exe --output target/triangle-release.png \
            > target/offscreen.log 2>&1 || { cat target/offscreen.log; exit 1; }
          cat target/offscreen.log
          grep -q 'compiles shaders with DXC' target/offscreen.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slime-examples-windows
          path: target/windows/
          if-no-files-found: error
          retention-days: 14
