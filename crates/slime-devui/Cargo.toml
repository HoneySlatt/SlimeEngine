[package]
name = "slime-devui"
description = "SlimeEngine's dev overlay: panels on the engine's interface drawn over a program's view, its statistics, a world panel and editors of reflected values."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The world panel shows asset IDs and colors as such.
slime-assets.workspace = true
slime-color.workspace = true
# The GPU and the target that the overlay draws over.
slime-gfx.workspace = true
# The window's size that the panels are laid out over.
slime-platform.workspace = true
# The panels drawn through the engine's bridge to uwui (ADR-0244), without the run's features.
slime-app.workspace = true
# The statistics of the view's renderer, which the panels show.
slime-render.workspace = true
# The panels on the engine's interface, in the editor's look (ADR-0152).
uwui = { workspace = true, features = ["editor-look"] }
# The world panel lists a world's entities and edits their components through reflection.
slime-reflect.workspace = true
slime-world.workspace = true

[dev-dependencies]
# The tests use the panels as a person does: the pointer and the keys.
slime-input.workspace = true
