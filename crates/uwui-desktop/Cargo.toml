[package]
name = "uwui-desktop"
description = "uwui's desktop host: an application on uwui alone, its window, its frames on the platform's signal and none at rest, on a windowing layer of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Waits for wgpu's requests, which are futures: the adapter and the device it opens.
pollster.workspace = true
# The window's raw handles, which the platform layer gives and wgpu makes the surface on
# (ADR-0270).
raw-window-handle.workspace = true
# Warnings of what the host leaves aside: a frame not drawn.
tracing.workspace = true
uwui.workspace = true
# Draws each frame's display list into the window's image.
uwui-render.workspace = true
# The platform layer below the host: the window, its input and its frames' signal, which knows
# neither the interface nor the GPU (ADR-0279).
uwui-windowing.workspace = true
# The device that the host opens and the window's surface (ADR-0244).
wgpu.workspace = true

[dev-dependencies]
# The pointers that the host's tests give.
slime-input.workspace = true
# The example draws in the editor's look, the only look that uwui has yet.
uwui = { workspace = true, features = ["editor-look"] }

# The Windows test's reads of the example's threads, its window, the mouse's moves and Ctrl+Break
# (ADR-0317).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The example run in a compositor, at rest, then ended by a signal: `scripts/check.sh windowed`
# and `scripts/compositors.sh` run it, in a compositor of their own.
[[test]]
name = "rest"
test = false

# The examples on Windows' desktop, at rest, closed, their device and surface lost: CI's Windows
# job of the host runs it, the examples built first.
[[test]]
name = "windows"
test = false
