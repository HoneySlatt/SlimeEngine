[package]
name = "slime-ui"
description = "SlimeEngine's UI framework, without a GPU: its tree of elements, their styles and their layout, and its text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Text shaped, ordered, broken into lines and laid out, the fonts found by fontique, which parley
# re-exports; fontique named for its feature that loads fontconfig at run time (ADR-0136).
fontique.workspace = true
parley.workspace = true
# The writing system of each character, by which the system's font found for it is named.
icu_properties.workspace = true
# The colors of what a display list draws, as every crate that holds a color names them (ADR-0045).
slime-color.workspace = true
# The keys, buttons and wheel that a person's input arrives as (ADR-0142).
slime-input.workspace = true
# The styles described, so that style sheets and themes, documents read by slime-serialize, set
# them (ADR-0132).
slime-reflect.workspace = true
slime-serialize.workspace = true
# Glyphs rasterized into coverage or color (ADR-0136).
swash.workspace = true
# The layout of the tree of elements: flexbox and grid (ADR-0132).
taffy.workspace = true
thiserror.workspace = true
# A warning when a stack names a family that the fonts lack (ADR-0008).
tracing.workspace = true
