[package]
name = "uwui-render"
description = "uwui's renderer: its canvas, which draws boxes, shadows, gradients and images, and its display lists drawn through it, with the glyphs' atlas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Places the glyphs' images in the atlas's pages, and frees them one by one (ADR-0132, ADR-0139).
etagere.workspace = true
# The canvas's colors, encoded into sRGB as an sRGB target mixes them (ADR-0137).
slime-color.workspace = true
# The GPU's handles that the canvas draws with, until it draws on wgpu (ADR-0244).
slime-gfx.workspace = true
uwui.workspace = true
# A warning when a frame's glyphs do not fit the atlas's budget, or a canvas's items its bound
# (ADR-0008).
tracing.workspace = true
