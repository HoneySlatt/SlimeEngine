[package]
name = "uwui-mcp"
description = "uwui's MCP library: an agent reads and drives a program on uwui through the Model Context Protocol, on uwui's core for agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Writes the captures that it returns as PNG images, encoded in base64 as MCP carries them.
base64.workspace = true
png.workspace = true
# The Model Context Protocol, its tools' parameters described by the JSON Schema of `schemars`,
# which rmcp re-exports (ADR-0269). Under Apache-2.0 alone: no crate that an application links
# depends on this one.
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
# rmcp's runtime: each request to a program waits on a thread of tokio's pool for blocking work.
tokio.workspace = true
uwui-agent.workspace = true

[dev-dependencies]
# The tests' interface, answered in memory by uwui's own answers to the interface's family, and
# the MCP session that the tests speak to the server through a pipe in memory, each read bounded
# by a time.
tokio = { workspace = true, features = ["io-util", "time"] }
uwui = { workspace = true, features = ["agents"] }
