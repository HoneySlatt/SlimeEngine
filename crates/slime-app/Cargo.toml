[package]
name = "slime-app"
description = "SlimeEngine's application lifecycle and main loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# What a presentation's interface means, translated into the tree that screen readers read, with
# the `accessibility` feature (ADR-0146).
accesskit = { workspace = true, optional = true }
ctrlc.workspace = true
# The development channel, in programs built with the `development` feature (ADR-0122): its
# protocol, and the documents through which it reads and writes the world's values as text.
slime-channel = { workspace = true, optional = true }
slime-serialize = { workspace = true, optional = true }
# The settings of a presentation's views, described to the development channel (ADR-0127); the
# world depends on it in every build.
slime-reflect.workspace = true
slime-gfx.workspace = true
slime-platform.workspace = true
# The interface that a presentation gives, which the development channel reads and acts on
# (ADR-0143).
slime-ui.workspace = true
slime-world.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `tracing-log`, a default feature, is named because `init_diagnostics` relies on it: it makes the
# subscriber also receive the records of the `log` crate, through which wgpu logs.
tracing-subscriber = { workspace = true, features = ["tracing-log"] }

[features]
# The development channel: a program started with a token listens for the tools that drive it
# (ADR-0110, ADR-0122). A game turns it on by default, and a build for shipping leaves it out
# (`--no-default-features`).
development = ["dep:slime-channel", "dep:slime-serialize", "slime-world/development"]
# Screen readers read what a presentation's interface means, through AccessKit's adapter of the
# window (ADR-0146): built into the examples, and into the editor once it has a window, left out of
# games until Stage 7.
accessibility = ["dep:accesskit", "slime-platform/accessibility"]

[target.'cfg(windows)'.dependencies]
nu-ansi-term.workspace = true

# The README's example and the windowed lifecycle test clear their targets to a color.
[dev-dependencies]
# The tests of the translation into AccessKit's tree build that tree from the updates, as the
# adapters do.
accesskit_consumer.workspace = true
slime-color.workspace = true
# The channel test is a tool that drives a run.
slime-channel.workspace = true
# The windowed lifecycle test makes a device invalid without telling the engine, as wgpu does
# before it reports a driver reset, which no API of the engine does.
slime-gfx = { workspace = true, features = ["wgpu"] }

# Drives a run through its development channel, which the feature builds.
[[test]]
name = "channel"
required-features = ["development"]

# Runs on the main thread, which the windowing library requires: see the test's module comment.
[[test]]
name = "windowed_errors"
harness = false

# Needs a Wayland compositor, so scripts/check.sh runs it in a headless Weston instead of the default
# test run; runs on the main thread like the one above (ADR-0024).
[[test]]
name = "windowed_lifecycle"
harness = false
test = false
