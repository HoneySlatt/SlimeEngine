[package]
name = "slime-platform"
description = "SlimeEngine's link to the operating system's windowing and input services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The adapter through which screen readers read what a window's interface means (ADR-0146): built
# into the examples, and into the editor once it has a window, left out of games until Stage 7.
accessibility = ["dep:accesskit", "dep:accesskit_winit"]

[dependencies]
# The tree that screen readers read, and its adapter for winit's windows (ADR-0146).
accesskit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }
# The system's clipboard, of text (ADR-0145).
arboard.workspace = true
raw-window-handle.workspace = true
# The engine's vocabulary of input, which the platform translates winit's events into (ADR-0142).
slime-input.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true
