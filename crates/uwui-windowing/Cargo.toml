[package]
name = "uwui-windowing"
description = "The platform layer of uwui's desktop host: a window, a person's input with its times and the platform's signal of frames, knowing neither uwui's interface nor the GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Its end on SIGTERM, SIGINT and SIGHUP, told to the host as a turn's (ADR-0270).
ctrlc.workspace = true
# The window's raw handles, given to the host, which makes its surface on them (ADR-0270).
raw-window-handle.workspace = true
# The keys, modifiers, buttons, pointers and wheel that a person's input arrives as, and the
# cursor's shapes (ADR-0142, ADR-0285).
slime-input.workspace = true
# Warnings of what the layer leaves aside: a protocol that the compositor lacks.
tracing.workspace = true
# The times of its events and of the platform's signal, on the host's clock (ADR-0279).
uwui-time.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The loop's poll, its eventfd that a wake writes, its timerfd on CLOCK_BOOTTIME for deadlines, and
# the kernel's notice of a resume, a timerfd on CLOCK_REALTIME; the host's clock; the machine's
# name, which X11's window gives with its process (ADR-0251, ADR-0270, ADR-0315).
rustix = { workspace = true, features = ["event", "system"] }
# Wayland spoken by the layer itself, on libwayland's display that Vulkan's driver shares
# (ADR-0270).
wayland-client.workspace = true
# xdg-shell's window and xdg-decoration's choice of who draws its bar; the cursor's shapes, the
# fractional scale and its viewport, activation (ADR-0273).
wayland-protocols.workspace = true
# The keyboard's keymaps, its state and its compose tables, from libxkbcommon loaded at run time;
# an X server's keymap and state from libxkbcommon-x11, loaded the same way (ADR-0270, ADR-0273,
# ADR-0313).
xkbcommon-dl.workspace = true
# X11 spoken by the layer itself, on libxcb's connection that Vulkan's driver presents on; its
# window, XInput2's pointer, keys and touch, RandR's rates, Present's notices, XKB's notices of the
# keymap and the modifiers, the cursor's shapes from the person's theme and the X resources
# (ADR-0270, ADR-0311, ADR-0313).
x11rb.workspace = true

# Needs an X server of its own, which `DISPLAY` names: run by the series' column of X11.
[[test]]
name = "x11"
test = false
