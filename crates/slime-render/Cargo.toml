[package]
name = "slime-render"
description = "SlimeEngine's renderer: meshes, materials, a camera and instances, drawn through the GPU layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
glam.workspace = true
slime-gfx.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The tests that lose the GPU device destroy it, which needs wgpu: the engine's own tests may reach
# it through slime-gfx's `wgpu` feature (ADR-0031).
[dev-dependencies]
slime-gfx = { workspace = true, features = ["wgpu"] }
