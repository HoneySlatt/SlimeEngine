[package]
name = "slime-gfx"
description = "SlimeEngine's GPU layer: the boundary between the engine and wgpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gives the engine's own tests the wgpu device behind the engine's, to make it invalid as a driver
# reset does (ADR-0031). Games must not enable it.
wgpu = []

[dependencies]
pollster.workspace = true
# `alloc`: the traits are implemented for `Arc`, which keeps the window to create its surface again.
raw-window-handle = { workspace = true, features = ["alloc"] }
slime-color.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[dev-dependencies]
# Encodes and decodes the BC blocks of the tests of compressed textures (`tests/blocks.rs`).
block_compression.workspace = true
