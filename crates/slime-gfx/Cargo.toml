[package]
name = "slime-gfx"
description = "SlimeEngine's GPU layer: the boundary between the engine and wgpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The guarded door through which the engine lends its wgpu device, `Gpu::with_wgpu` (ADR-0244):
# for `slime-app`'s bridge to uwui's renderer and the engine's own tests, which scripts/check.sh
# keeps to them.
wgpu = []

[dependencies]
pollster.workspace = true
# `alloc`: the traits are implemented for `Arc`, which keeps the window to create its surface again.
raw-window-handle = { workspace = true, features = ["alloc"] }
slime-color.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[dev-dependencies]
# Encodes and decodes the BC blocks of the tests of compressed textures (`tests/blocks.rs`).
block_compression.workspace = true

# The door's tests, which need the feature: `cargo test --workspace` turns it on through
# `slime-app`, and `cargo test -p slime-gfx --features wgpu` alone.
[[test]]
name = "door"
required-features = ["wgpu"]
