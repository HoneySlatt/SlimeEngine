[package]
name = "slime-mcp"
description = "SlimeEngine's MCP server: an agent drives a running game through its development channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rmcp.workspace = true
serde.workspace = true
slime-channel.workspace = true
tokio.workspace = true
# uwui's MCP library, on which the server stands: the interface's tools, a page of a list, a
# program's faults as tools' errors (ADR-0269).
uwui-mcp.workspace = true

[dev-dependencies]
# The sessions' tests read the captures that the server returns: PNG images, in base64.
base64.workspace = true
png.workspace = true
serde_json.workspace = true

# Drives Hunna Wood, and checks that it is at rest while paused; it needs a Wayland compositor and
# the cooked zone: `scripts/check.sh` runs it in a headless Weston, as it runs the windowed
# lifecycle test (ADR-0024, ADR-0185).
[[test]]
name = "drive"
test = false
harness = false

# Captures each view of the `world` example, which needs a Wayland compositor and the examples'
# cooked assets: `scripts/check.sh` runs it in a headless Weston too (ADR-0126).
[[test]]
name = "views"
test = false
harness = false

# Uses the `interface` example's interface, which needs a Wayland compositor and the examples'
# cooked assets: `scripts/check.sh` runs it in a headless Weston too (ADR-0143).
[[test]]
name = "interface"
test = false
harness = false

# Uses each widget of the `widgets` example, which needs a Wayland compositor: `scripts/check.sh`
# runs it in a headless Weston too (ADR-0148).
[[test]]
name = "widgets"
test = false
harness = false

# Edits a copy of the examples' yard through the `editor` example run without its window, and
# needs the examples' cooked assets: `scripts/check.sh` runs it with the samples (ADR-0135).
[[test]]
name = "edit"
test = false
harness = false

# Uses the `editor` example's window, its operations run by name, its menus and its palette, and
# checks that it is at rest while alone; it needs a compositor and the examples' cooked assets:
# `scripts/check.sh` runs it in a headless Weston (ADR-0156, ADR-0185).
[[test]]
name = "edit_window"
test = false
harness = false

# Edits a copy of Hunna Wood's zone through its editor package run without its window, and needs
# the zone cooked: `scripts/check.sh` runs it with the tests that read the zone (ADR-0135).
[[test]]
name = "edit_zone"
test = false
harness = false

# The first measures of memory and power: the editor on Hunna Wood's zone, over undos, redos and
# runs of Play, then the game; a measure, not a check, which `scripts/resources.sh` runs in a
# headless Weston (ADR-0193).
[[test]]
name = "resources"
test = false
harness = false

# The engine's answer through the server, measured on the `editor` example's window in a headless
# Weston, or, with `--at-once`, on a program of the tests' own that answers at once: a measure, not
# a check, run by hand (docs/measurements.md).
[[test]]
name = "answer"
test = false
harness = false

# How the editor's window adapts to a compositor of the series: the cursor, and a round trip
# through the system's clipboard by a person's keys; `scripts/compositors.sh` runs it in each
# compositor (ADR-0195).
[[test]]
name = "compositor"
test = false
harness = false
