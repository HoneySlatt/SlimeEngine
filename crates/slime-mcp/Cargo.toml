[package]
name = "slime-mcp"
description = "SlimeEngine's MCP server: an agent drives a running game through its development channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
# Writes the captures that it returns as PNG images.
png.workspace = true
rmcp.workspace = true
serde.workspace = true
slime-channel.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Drives Hunna Wood, which needs a Wayland compositor and the cooked zone: `scripts/check.sh` runs it
# in a headless Weston, as it runs the windowed lifecycle test (ADR-0024).
[[test]]
name = "drive"
test = false
harness = false

# Captures each view of the `world` example, which needs a Wayland compositor and the examples'
# cooked assets: `scripts/check.sh` runs it in a headless Weston too (ADR-0126).
[[test]]
name = "views"
test = false
harness = false

# Uses the `interface` example's interface, which needs a Wayland compositor and the examples'
# cooked assets: `scripts/check.sh` runs it in a headless Weston too (ADR-0143).
[[test]]
name = "interface"
test = false
harness = false

# Uses each widget of the `widgets` example, which needs a Wayland compositor: `scripts/check.sh`
# runs it in a headless Weston too (ADR-0148).
[[test]]
name = "widgets"
test = false
harness = false

# Edits a copy of the examples' yard through the `editor` example, which has no window, and needs
# the examples' cooked assets: `scripts/check.sh` runs it with the samples (ADR-0135).
[[test]]
name = "edit"
test = false
harness = false

# Edits a copy of Hunna Wood's zone through its editor package, which has no window, and needs the
# zone cooked: `scripts/check.sh` runs it with the tests that read the zone (ADR-0135).
[[test]]
name = "edit_zone"
test = false
harness = false
