[package]
name = "slime-examples"
description = "Runnable examples of SlimeEngine features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Examples are the only targets of this package, so their dependencies are dev-dependencies.
[dev-dependencies]
# The tests only: they write the small glTF files they cook.
gltf.workspace = true
png.workspace = true
# The examples' programs are never shipped: they hold the development channel, through which
# tools drive them (ADR-0122).
slime-app = { workspace = true, features = ["development"] }
slime-assets.workspace = true
slime-color.workspace = true
slime-cook.workspace = true
slime-devui.workspace = true
# The editor's program, which the `editor` example runs on the yard (ADR-0135).
slime-editor.workspace = true
slime-gfx.workspace = true
slime-platform.workspace = true
slime-render.workspace = true
# The interface's text, which the `text` example lays out and rasterizes (ADR-0136).
slime-ui.workspace = true
slime-world.workspace = true
slime-world-render.workspace = true
tracing.workspace = true

[[example]]
name = "hello"
path = "hello.rs"

[[example]]
name = "headless"
path = "headless.rs"

[[example]]
name = "window"
path = "window.rs"

[[example]]
name = "offscreen"
path = "offscreen.rs"

[[example]]
name = "scene"
path = "scene.rs"

[[example]]
name = "world"
path = "world.rs"

[[example]]
name = "editor"
path = "editor.rs"

[[example]]
name = "text"
path = "text.rs"
